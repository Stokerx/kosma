[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kosma"
version = "0.1.0"
description = "High-performance Python backend framework with Laravel DX and Rust core"
readme = "README.md"
authors = [
    { name = "Stoker", email = "stoker@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "orjson>=3.10.0",
]

[project.scripts]
kosma = "kosma.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.5.0,<2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "uv>=0.12.0",
]

[tool.maturin]
manifest-path = "crates/kosma-core/Cargo.toml"
python-source = "python"
module-name = "kosma.kosma_core"
features = ["pyo3/extension-module"]

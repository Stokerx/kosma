[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kosma"
version = "0.1.0"
description = "High-performance Python backend framework with Laravel DX and Rust core"
readme = "README.md"
authors = [
    { name = "Kosma Team" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "orjson>=3.10.0",
]

[project.scripts]
kosma = "kosma.cli:main"

[tool.maturin]
manifest-path = "crates/kosma-core/Cargo.toml"
python-source = "python"
module-name = "kosma.kosma_core"
features = ["pyo3/extension-module"]
